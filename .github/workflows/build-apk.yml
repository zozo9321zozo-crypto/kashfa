name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      # 1. سحب كود المشروع من GitHub
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. إعداد بيئة Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 3. إعداد بيئة Java لبناء الأندرويد
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 4. تثبيت المكتبات وتثبيت Capacitor تلقائياً
      - name: Install Dependencies
        run: |
          npm ci
          npm install @capacitor/core @capacitor/cli @capacitor/android

      # 5. بناء مشروع Vite (توليد مجلد dist)
      - name: Build Web Project
        run: npm run build

      # 6. تهيئة منصة الأندرويد ومزامنتها
      - name: Capacitor Sync
        run: |
          npx cap init "حضور وانصراف كشافة العباس" "com.kashaf.alabbas" --web-dir "dist" || true
          npx cap add android || true
          npx cap copy android
          npx cap sync android

      # 7. تجميع وتوليد ملف הـ APK
      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      # 8. رفع ملف الـ APK لتتمكن من تنزيله
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kashaf-Alabbas-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
